<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050607">
<title>Vera Rubin VR-300 · Interactive 3D Teardown · Civo</title>
<meta name="description" content="An interactive, real-time 3D teardown of the Vera Rubin VR-300 accelerator. Explore eight subsystems from board level down to the circuit. Built for Civo.">
<meta property="og:title" content="Vera Rubin VR-300 — Interactive 3D Teardown">
<meta property="og:description" content="Real-time WebGL2 teardown: twin-reticle dies, Dark Matter Cache, co-packaged optics, two-phase cooling. Zoom to circuit level.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23050607'/%3E%3Crect x='7' y='7' width='18' height='18' rx='3' fill='none' stroke='%23A3E635' stroke-width='2'/%3E%3Crect x='12.5' y='12.5' width='7' height='7' fill='%23A3E635'/%3E%3C/svg%3E">
<style>
:root{
  --lime:#A3E635;
  --lime-hot:#D4FF4E;
  --lime-deep:#6FA815;
  --bg:#050607;
  --ink:#E8EFE2;
  --muted:#8C9A86;
  --line:rgba(163,230,53,.20);
  --glass:rgba(9,12,10,.66);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  overflow:hidden;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
canvas#gl{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas#gl.grabbing{cursor:grabbing}

/* ---------------------------------------------------------------- chrome */
.hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.hud > *{pointer-events:auto}
body.ui-hidden .hud{opacity:0;transition:opacity .4s ease}

#brand{
  position:fixed;top:26px;left:30px;display:flex;align-items:center;gap:16px;
  z-index:6;pointer-events:none;
}
.wordmark{
  font-weight:800;font-size:26px;letter-spacing:-.045em;color:var(--lime);
  line-height:1;text-transform:lowercase;
}
.wordmark span{color:var(--ink)}
.brand-div{width:1px;height:26px;background:linear-gradient(180deg,transparent,var(--line),transparent)}
.brand-txt{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;line-height:1.55}
.brand-txt b{display:block;color:var(--ink);font-weight:600;letter-spacing:.18em}

#stats{
  position:fixed;top:26px;right:30px;display:flex;gap:8px;z-index:6;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);
}
.chip{
  border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.025);
  padding:6px 10px;border-radius:6px;backdrop-filter:blur(8px);white-space:nowrap;
}
.chip b{color:var(--lime);font-weight:600}

/* ------------------------------------------------------------- callouts */
#leaders{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;
  transition:opacity .45s ease}
.leader-line{fill:none;stroke:rgba(163,230,53,.42);stroke-width:1;
  stroke-dasharray:3 3;animation:dash 14s linear infinite}
@keyframes dash{to{stroke-dashoffset:-120}}
.leader-head{fill:var(--lime);opacity:.8}
.leader-dot{fill:var(--lime-hot)}
.leader-ring{fill:none;stroke:var(--lime);stroke-width:1;opacity:.5;
  transform-box:fill-box;transform-origin:center;animation:ping 3.2s ease-out infinite}
@keyframes ping{0%{r:4;opacity:.85}70%,100%{r:15;opacity:0}}
.leader.hot .leader-line{stroke:var(--lime-hot);stroke-width:1.6;stroke-dasharray:none}
.leader.hot .leader-head{opacity:1}

.rail{position:fixed;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;
  gap:12px;z-index:4;width:318px}
#rail-left{left:30px;align-items:flex-start}
#rail-right{right:30px;align-items:flex-end}

.callout{
  -webkit-appearance:none;appearance:none;text-align:left;font:inherit;color:inherit;
  display:flex;gap:12px;width:100%;padding:13px 14px;cursor:pointer;
  background:linear-gradient(180deg,rgba(14,18,14,.78),rgba(6,8,7,.72));
  border:1px solid rgba(255,255,255,.075);border-left:2px solid rgba(163,230,53,.5);
  border-radius:10px;backdrop-filter:blur(14px) saturate(1.2);
  box-shadow:0 12px 34px -18px rgba(0,0,0,.95);
  transition:transform .32s cubic-bezier(.2,.8,.2,1),border-color .3s,background .3s,box-shadow .3s;
}
#rail-left .callout{animation:slideinL .8s cubic-bezier(.2,.9,.2,1) backwards}
#rail-right .callout{animation:slideinR .8s cubic-bezier(.2,.9,.2,1) backwards}
@keyframes slideinL{from{opacity:0;transform:translateX(-18px)}}
@keyframes slideinR{from{opacity:0;transform:translateX(18px)}}
.callout:nth-child(1){animation-delay:.55s}
.callout:nth-child(2){animation-delay:.68s}
.callout:nth-child(3){animation-delay:.81s}
.callout:nth-child(4){animation-delay:.94s}
.callout:hover,.callout:focus-visible{
  border-color:rgba(163,230,53,.55);border-left-color:var(--lime);
  background:linear-gradient(180deg,rgba(24,32,18,.86),rgba(10,14,9,.8));
  box-shadow:0 18px 44px -18px rgba(0,0,0,1),0 0 0 1px rgba(163,230,53,.12),
             0 0 28px -8px rgba(163,230,53,.35);
  outline:none;
}
#rail-left .callout:hover{transform:translateX(6px)}
#rail-right .callout:hover{transform:translateX(-6px)}
.c-tag{font-family:var(--mono);font-size:10px;color:var(--lime);opacity:.85;padding-top:2px;letter-spacing:.05em}
.c-body{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.c-kicker{font-family:var(--mono);font-size:8.5px;letter-spacing:.26em;color:var(--lime-deep)}
.c-title{font-size:14px;font-weight:650;letter-spacing:-.01em;line-height:1.25}
.c-teaser{font-size:11.5px;color:var(--muted);line-height:1.42}
.c-go{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:var(--lime);
  display:flex;align-items:center;gap:5px;opacity:0;max-height:0;overflow:hidden;
  transition:opacity .3s,max-height .3s;
}
.callout:hover .c-go,.callout:focus-visible .c-go{opacity:1;max-height:20px}
.c-go svg{transition:transform .3s}
.callout:hover .c-go svg{transform:translateX(3px)}

body.inspecting .rail{opacity:0;transform:translateY(-50%) scale(.97);pointer-events:none;
  transition:opacity .4s,transform .4s}
.rail{transition:opacity .5s .1s,transform .5s .1s}

/* ---------------------------------------------------------------- panel */
#panel{
  position:fixed;left:30px;top:50%;transform:translate(-118%,-50%);width:400px;max-width:calc(100vw - 60px);
  max-height:min(78vh,720px);overflow:auto;z-index:7;
  background:linear-gradient(180deg,rgba(12,16,12,.9),rgba(5,7,6,.88));
  border:1px solid rgba(255,255,255,.08);border-left:2px solid var(--lime);
  border-radius:14px;backdrop-filter:blur(22px) saturate(1.25);
  box-shadow:0 40px 90px -40px #000,0 0 60px -30px rgba(163,230,53,.4);
  transition:transform .72s cubic-bezier(.16,.9,.2,1),opacity .5s;opacity:0;
  scrollbar-width:thin;scrollbar-color:var(--lime-deep) transparent;
}
body.inspecting #panel{transform:translate(0,-50%);opacity:1}
#panel::-webkit-scrollbar{width:6px}
#panel::-webkit-scrollbar-thumb{background:rgba(163,230,53,.3);border-radius:3px}
.p-head{padding:22px 24px 0;display:flex;align-items:baseline;gap:12px}
#p-tag{font-family:var(--mono);font-size:44px;font-weight:200;color:var(--lime);
  line-height:.8;letter-spacing:-.04em;opacity:.9}
.p-headtxt{flex:1;min-width:0}
#p-kicker{font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--lime-deep);display:block}
#p-title{font-size:23px;font-weight:680;letter-spacing:-.025em;margin:5px 0 0;line-height:1.15}
#p-index{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.16em}
.p-rule{height:1px;margin:18px 24px 0;background:linear-gradient(90deg,var(--lime),rgba(163,230,53,0))}
#p-body{padding:16px 24px 0;font-size:13.5px;line-height:1.62;color:#C3CDBD}
#p-body b{color:var(--lime-hot);font-weight:640}
#p-body i{color:var(--ink);font-style:italic}
#p-specs{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:20px 0 0;
  background:rgba(255,255,255,.055);border-top:1px solid rgba(255,255,255,.055);
  border-bottom:1px solid rgba(255,255,255,.055)}
.spec{background:rgba(6,9,6,.9);padding:11px 14px 12px}
.spec dt{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:var(--muted);
  text-transform:uppercase}
.spec dd{margin:5px 0 0;font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--lime)}
.p-actions{padding:16px 24px 22px;display:flex;flex-direction:column;gap:10px}
/* Deliberately not uppercased: text-transform turns "µm" into "ΜM". */
#macro-hint{font-family:var(--mono);font-size:9.5px;letter-spacing:.10em;color:var(--muted);
  line-height:1.65}

.btn{
  -webkit-appearance:none;appearance:none;font:inherit;cursor:pointer;
  font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  padding:12px 16px;border-radius:8px;transition:all .25s;
  border:1px solid rgba(163,230,53,.35);background:rgba(163,230,53,.07);color:var(--lime);
}
.btn:hover{background:var(--lime);color:#08120A;border-color:var(--lime);
  box-shadow:0 0 30px -6px rgba(163,230,53,.6)}
.btn.ghost{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.03);color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.07);box-shadow:none}
.btn.on{background:var(--lime);color:#08120A}

/* ------------------------------------------------------------- controls */
#dock{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:8px;z-index:6;
}
#hints{
  position:fixed;left:30px;bottom:26px;z-index:6;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.12em;color:var(--muted);line-height:1.9;text-transform:uppercase;
  transition:opacity .4s;
}
#hints kbd{
  font:inherit;border:1px solid rgba(255,255,255,.14);border-bottom-width:2px;
  border-radius:4px;padding:1px 5px;color:var(--ink);background:rgba(255,255,255,.04);margin:0 1px;
}
body.inspecting #hints{opacity:.35}

#ribbon{
  position:fixed;right:30px;bottom:26px;z-index:6;display:flex;gap:0;
  border:1px solid rgba(255,255,255,.07);border-radius:8px;overflow:hidden;
  background:var(--glass);backdrop-filter:blur(12px);
  transition:opacity .4s,transform .4s;
}
.hl{padding:9px 14px;border-right:1px solid rgba(255,255,255,.06);text-align:right}
.hl:last-child{border-right:none}
.hl b{display:block;font-size:16px;font-weight:650;letter-spacing:-.03em;color:var(--lime)}
.hl span{font-family:var(--mono);font-size:8px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
body.inspecting #ribbon{opacity:0;transform:translateY(12px);pointer-events:none}

#tooltip{
  position:fixed;top:0;left:0;z-index:9;pointer-events:none;opacity:0;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  padding:6px 9px;border-radius:6px;border:1px solid var(--line);
  background:rgba(6,9,6,.92);color:var(--lime);transition:opacity .18s;white-space:nowrap;
}
#tooltip.on{opacity:1}

/* ---------------------------------------------------------- macro frame */
#macro-frame{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .6s}
body.macro #macro-frame{opacity:1}
.corner{position:absolute;width:34px;height:34px;border:1px solid rgba(163,230,53,.5)}
.corner.tl{top:76px;left:76px;border-right:0;border-bottom:0}
.corner.tr{top:76px;right:76px;border-left:0;border-bottom:0}
.corner.bl{bottom:76px;left:76px;border-right:0;border-top:0}
.corner.br{bottom:76px;right:76px;border-left:0;border-top:0}
.cross{position:absolute;left:50%;top:50%;width:1px;height:26px;background:rgba(163,230,53,.35);
  transform:translate(-50%,-50%)}
.cross.h{width:26px;height:1px}
#scanline{position:absolute;left:76px;right:76px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(163,230,53,.55),transparent);
  animation:scan 5.5s cubic-bezier(.6,0,.4,1) infinite}
@keyframes scan{0%{top:76px;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:calc(100% - 76px);opacity:0}}

/* -------------------------------------------------------------- loader */
#loader{
  position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:20px;
  transition:opacity .9s ease,visibility .9s;
}
#loader.gone{opacity:0;visibility:hidden}
.l-mark{font-weight:800;font-size:40px;letter-spacing:-.05em;color:var(--lime)}
.l-mark span{color:var(--ink)}
.l-bar{width:220px;height:2px;background:rgba(255,255,255,.09);overflow:hidden;border-radius:2px}
.l-bar i{display:block;height:100%;width:40%;background:var(--lime);
  animation:load 1.1s cubic-bezier(.6,0,.3,1) infinite}
@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
.l-txt{font-family:var(--mono);font-size:9px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase}

#fallback{
  position:fixed;inset:0;z-index:21;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;background:var(--bg);padding:40px;text-align:center;
}
#fallback h2{font-size:19px;font-weight:600;margin:0;color:var(--lime)}
#fallback p{max-width:460px;color:var(--muted);font-size:13.5px;line-height:1.6;margin:0;
  font-family:var(--mono);letter-spacing:.02em}

/* ------------------------------------------------------------ responsive */
@media (max-width:1180px){
  .rail{width:262px}
  #rail-left{left:18px}#rail-right{right:18px}
  .c-teaser{display:none}
}
@media (max-width:900px){
  #leaders{display:none}
  .rail{position:fixed;top:auto;bottom:78px;left:0;right:0;width:100%;transform:none;
    flex-direction:row;overflow-x:auto;gap:10px;padding:4px 16px 8px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  #rail-right{display:none}
  .callout{min-width:230px;width:auto;transform:none!important}
  body.inspecting .rail{transform:translateY(30px)}
  #panel{left:0;right:0;bottom:0;top:auto;width:100%;max-width:100%;transform:translateY(110%);
    max-height:72vh;border-radius:16px 16px 0 0;border-left:1px solid rgba(255,255,255,.08);
    border-top:2px solid var(--lime)}
  body.inspecting #panel{transform:translateY(0)}
  #ribbon,#hints{display:none}
  #brand{top:16px;left:18px;gap:0}
  .brand-div,.brand-txt{display:none}
  .wordmark{font-size:22px}
  #stats{top:18px;right:18px}
  .chip:nth-child(n+2){display:none}
  #dock{bottom:14px;gap:6px}
  .btn{padding:10px 11px;font-size:9px;letter-spacing:.12em;white-space:nowrap}
  .callout{padding:11px 12px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.12s!important}
}
</style>
